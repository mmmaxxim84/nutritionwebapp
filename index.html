<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f2937"><link rel="manifest" href="manifest.json"><title>Menu settimanale</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f5f7;color:#18202a}header{background:#1f2937;color:#fff;padding:20px 16px 17px;position:sticky;top:0;z-index:5}h1{font-size:22px;margin:0 0 4px}.sub{font-size:13px;opacity:.75}main{max-width:720px;margin:auto;padding:12px 12px 85px}.day{background:#fff;border-radius:15px;margin:10px 0;overflow:hidden;box-shadow:0 1px 5px #0001}.day h2{font-size:16px;margin:0;padding:13px;background:#eef0f3}.meal{padding:11px 13px;border-top:1px solid #eee}.meal strong{display:block;font-size:13px;margin-bottom:6px}.meal input{width:100%;padding:10px;border:1px solid #d5d9df;border-radius:9px;font-size:14px}.actions{display:flex;gap:8px;margin:10px 0 15px}.btn{border:0;border-radius:10px;padding:11px 13px;font-weight:600}.primary{background:#1f2937;color:#fff}.secondary{background:#e9edf1}.tab{display:none}.tab.active{display:block}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:10}nav button{flex:1;border:0;background:#fff;padding:10px;color:#69727d;font-size:12px}nav button.active{color:#111827;font-weight:700}.cat{background:#fff;border-radius:14px;margin:10px 0;overflow:hidden}.cat h3{margin:0;padding:12px 14px;font-size:14px}.item{padding:10px 14px;border-top:1px solid #eee;display:flex;gap:9px;align-items:center;font-size:14px}.item input{width:19px;height:19px}.empty{text-align:center;color:#777;padding:25px}.note{font-size:12px;color:#69727d}
</style></head><body>
<header><h1>Menu settimanale</h1><div class="sub" id="week"></div></header>
<main><section id="menu" class="tab active"></section><section id="shopping" class="tab">
<div class="actions"><button class="btn primary" onclick="buildShopping()">Aggiorna lista</button><button class="btn secondary" onclick="clearChecks()">Azzera</button></div>
<div class="note">La lista raccoglie automaticamente gli ingredienti riconosciuti nel menu.</div><div id="list"></div></section></main>
<nav><button id="nm" class="active" onclick="showTab('menu')">🏠<br>Menu</button><button id="ns" onclick="showTab('shopping')">🛒<br>Spesa</button></nav>
<script>
const days=["Lunedì","Martedì","Mercoledì","Giovedì","Venerdì","Sabato","Domenica"], meals=["Colazione","Spuntino mattina","Pranzo","Spuntino pomeriggio","Cena"];
const defaults=[["Yogurt greco + muesli + frutta","Frutta","Pasta + verdure + pollo","Mandorle","Pesce + verdure + pane"],["Latte + cereali + frutta","Yogurt","Riso + pollo + verdure","Frutta secca","Uova + verdure + pane"],["Yogurt + muesli + frutta","Frutta","Pasta al pomodoro + proteine + verdure","Yogurt","Pesce + verdure"],["Pane + marmellata + yogurt","Frutta","Riso + tonno + verdure","Mandorle","Carne + verdure + pane"],["Yogurt + muesli + frutta","Frutta","Pasta + legumi + verdure","Frutta secca","Pesce + verdure + pane"],["Cappuccino + brioche","Frutta","Pasto libero","—","Cena libera"],["Cappuccino + brioche","—","Pranzo libero","—","Pizza margherita + contorno"]];
const ing={"yogurt":"Yogurt greco","muesli":"Muesli","frutta":"Frutta","pasta":"Pasta","verdure":"Verdure","pollo":"Petto di pollo","mandorle":"Mandorle","pesce":"Pesce","pane":"Pane","latte":"Latte","cereali":"Cereali","riso":"Riso","tonno":"Tonno","uova":"Uova","marmellata":"Marmellata","legumi":"Legumi","brioche":"Brioche","cappuccino":"Caffè + latte","pizza":"Pizza margherita"};
let data=JSON.parse(localStorage.getItem("menu-data")||"null")||defaults.map(x=>[...x]);
function save(){localStorage.setItem("menu-data",JSON.stringify(data))}
function render(){menu.innerHTML=days.map((d,i)=>`<div class="day"><h2>${d}</h2>${meals.map((m,j)=>`<div class="meal"><strong>${m}</strong><input value="${esc(data[i][j]||"")}" onchange="data[${i}][${j}]=this.value;save()"></div>`).join("")}</div>`).join("");week.textContent=label()}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;")}
function label(){let d=new Date(),n=d.getDay()||7,m=new Date(d);m.setDate(d.getDate()-n+1),s=new Date(m);s.setDate(m.getDate()+6);return `${m.toLocaleDateString("it-IT",{day:"2-digit",month:"long"})} – ${s.toLocaleDateString("it-IT",{day:"2-digit",month:"long",year:"numeric"})}`}
function showTab(id){document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active");nm.classList.toggle("active",id==="menu");ns.classList.toggle("active",id==="shopping");if(id==="shopping")buildShopping()}
function buildShopping(){let found={};data.flat().forEach(t=>{let s=t.toLowerCase();Object.keys(ing).forEach(k=>{if(s.includes(k))found[ing[k]]=1})});let a=Object.keys(found).sort();list.innerHTML=a.length?a.map(x=>`<label class="item"><input type="checkbox"> ${x}</label>`).join(""):"<div class='empty'>Nessun ingrediente riconosciuto.</div>"}
function clearChecks(){document.querySelectorAll("#list input").forEach(x=>x.checked=false)}
render();
</script></body></html>
