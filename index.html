<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#18212b"><link rel="manifest" href="manifest.json">
<title>Menu settimanale · Sere e Meridio</title>
<style>
:root{--ink:#18212b;--muted:#69727d;--bg:#f4f5f7;--card:#fff;--line:#e5e7eb;--accent:#18212b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
header{background:var(--ink);color:#fff;padding:18px 16px 16px;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px #0002}header h1{font-size:19px;margin:0 0 3px}header p{font-size:12px;margin:0;opacity:.75}
main{max-width:760px;margin:auto;padding:12px 12px 90px}.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button,nav button{appearance:none;border:0;border-radius:11px;padding:12px 10px;font-weight:700;font-size:14px;background:#e7ebef;color:var(--ink)}.tabs button{flex:1}.tabs .on,nav .on{background:var(--accent);color:#fff}
.info{background:#eef2f5;border-radius:12px;padding:11px 12px;font-size:12px;line-height:1.45;margin-bottom:12px}.day{background:var(--card);border-radius:14px;margin:10px 0;overflow:hidden;box-shadow:0 1px 3px #0000000b}.day h2{font-size:16px;margin:0;padding:12px;background:#e9edf1}.day h2 span{float:right;font-size:11px;font-weight:400;color:var(--muted);padding-top:2px}.meal{padding:12px 13px;border-top:1px solid var(--line);line-height:1.4}.meal b{display:block;font-size:13px;margin-bottom:5px}.meal .choice{margin:4px 0}.meal .choice:before{content:'• ';color:var(--muted)}
.cat{background:var(--card);border-radius:13px;margin:10px 0;overflow:hidden;box-shadow:0 1px 3px #0000000b}.cat h3{margin:0;padding:11px 12px;font-size:14px}.item{display:flex;align-items:center;gap:9px;padding:11px 12px;border-top:1px solid var(--line);font-size:14px}.item input{width:19px;height:19px}.item.done span{text-decoration:line-through;color:#8a9199}.small{font-size:11px;color:var(--muted);margin-top:8px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;gap:8px;padding:8px max(8px,env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line);z-index:20}nav button{flex:1}
.page{display:none}.page.active{display:block}.reset{width:100%;border:0;background:#e7ebef;color:var(--ink);padding:10px;border-radius:10px;font-weight:700;margin-top:4px}.legend{font-size:11px;color:var(--muted);margin:6px 2px 10px}
</style>
</head>
<body>
<header><h1>Menu settimanale</h1><p>Sere e Meridio · piano personale e lista della spesa</p></header>
<main>
<section id="menu" class="page active">
 <div class="tabs"><button id="bs" class="on">Sere</button><button id="bm">Meridio</button></div>
 <div id="info" class="info"></div><div id="days"></div>
</section>
<section id="shop" class="page">
 <div class="tabs"><button id="bb" class="on">Sere + Meridio</button><button id="bs2">Solo Sere</button><button id="bm2">Solo Meridio</button></div>
 <div class="info">Lista della spesa senza quantità: ogni alimento compare una sola volta. Il pranzo di Meridio in mensa è escluso dalla spesa; le gallette portate da casa invece sono incluse.</div>
 <div id="list"></div><button class="reset" id="reset">Azzera spunte della lista</button>
</section>
</main>
<nav><button id="nm" class="on">🏠 Menu</button><button id="ng">🛒 Spesa</button></nav>
<script>
const S=[
['Lunedì','Riposo',['Yogurt greco bianco intero o Skyr (200 g) con 30 g di avena, un cucchiaino di burro d’arachidi e cannella.','1 mela verde oppure 10 mandorle.','Riso basmati o farro freddo (60–70 g) con pollo o tofu e verdure con olio EVO.','Un quadratino di cioccolato fondente (85%+) con 3–4 noci o mandorle.','Merluzzo o salmone al forno con 100 g di patate al forno e insalata mista.']],
['Martedì','Allenamento 1 – Forza',['Uova strapazzate (2–3) con velo di pane integrale, frutta secca e caffè.','Stick di parmigiano (30 g).','Patate lesse o dolci (150–200 g) con sgombro o tonno al naturale e zucchine/spinaci.','Una galletta di riso o farro con un velo di marmellata senza zuccheri aggiunti o miele + tè verde.','Straccetti di manzo con rucola, pomodorini e una fetta di pane di segale.']],
['Mercoledì','Allenamento 2 – Cardio',['Yogurt greco o Skyr (200 g) con cereali integrali e frutta fresca.','Mini brick di Skyr liquido oppure una manciata di mirtilli.','Cous cous o quinoa (60 g) con ceci o lenticchie, pomodorini e cetrioli.','Un frutto fresco di stagione (es. pera o kiwi) con 3–4 mandorle.','Frittata con spinaci e passato di verdure con un cucchiaio di parmigiano.']],
['Giovedì','Riposo',['Uova strapazzate con pane integrale e frutta secca.','Manciata di frutta secca mista (20 g).','Petto di tacchino ai ferri con riso nero o integrale (60 g) e broccoli o fagiolini.','Un piccolo vasetto di yogurt bianco magro o greco con un pizzico di cannella.','Petto di pollo alla piastra con guacamole leggero e verdure verdi cotte.']],
['Venerdì','Allenamento 3 – Catena Posteriore',['Yogurt greco bianco con avena, burro d’arachidi e cannella.','Un cucchiaio di burro d’arachidi preso al volo oppure un pezzetto di parmigiano.','Orzo o farro (60 g) con carne macinata magra saltata con peperoni o carote.','Una manciata di uvetta oppure un piccolo frutto + 2–3 noci.','Polpo o seppie con patate lesse oppure gamberi con zucchine e riso basmati (50 g).']],
['Sabato','Weekend',['Libera ma controllata: pancake fit oppure fetta di dolce fatto in casa con caffè.','Frutta fresca di stagione con qualche mandorla.','Pasta o riso (70–80 g) con sugo leggero, fonte proteica e verdura.','Uno yogurt oppure un tè con qualche biscotto secco integrale.','Pasto libero gestito fuori casa o in relax.']],
['Domenica','La Pizza',['Yogurt, frutta, pane tostato oppure uova.','Frutta fresca.','Petto di pollo o pesce magro con verdure fresche e quota moderata di carboidrati (40–50 g).','Una tisana oppure un frutto leggero.','Finocchio o insalata cruda + pizza classica della tradizione.']]
];
const M=[
['Lunedì','Allenamento',['150 g di yogurt greco bianco 0% o Skyr + 30 g di cereali integrali Misura + cannella + 1 caffè amaro o tè verde.','1 frutto di stagione + 15 g di mandorle o noci.','Mensa: seconda portata a scelta tra pollo, tacchino, vitello magro, pesce bianco o merluzzo (150–200 g), verdure abbondanti e 60–70 g di riso/farro se disponibile; alternativa: 3 gallette di riso/farro portate da casa.','1 banana media oppure 2 gallette di riso con un velo leggero di crema 100% arachidi.','180–200 g di carne bianca, manzo magro o pesce + 180–200 g di patate oppure 70 g di riso basmati + verdure e 1 cucchiaio di olio EVO.']],
['Martedì','Riposo',['Yogurt greco bianco 0% o Skyr + 30 g di cereali integrali Misura + cannella + caffè/tè verde.','20 g di mandorle o noci.','Mensa: carne bianca o pesce (180–200 g) + doppia porzione di verdure + 1 cucchiaio di olio EVO; carboidrati azzerati.','100 g di yogurt greco 0% oppure 15 g di frutta secca.','200 g di pesce o carne magra + verdure; nessuna fonte di carboidrati complessi.']],
['Mercoledì','Allenamento',['150 g di yogurt greco bianco 0% o Skyr + 30 g di cereali integrali Misura + cannella + 1 caffè amaro o tè verde.','1 frutto di stagione + 15 g di mandorle o noci.','Mensa: seconda portata a scelta tra pollo, tacchino, vitello magro, pesce bianco o merluzzo (150–200 g), verdure abbondanti e 60–70 g di riso/farro se disponibile; alternativa: 3 gallette di riso/farro portate da casa.','1 banana media oppure 2 gallette di riso con un velo leggero di crema 100% arachidi.','180–200 g di carne bianca, manzo magro o pesce + 180–200 g di patate oppure 70 g di riso basmati + verdure e 1 cucchiaio di olio EVO.']],
['Giovedì','Riposo',['Yogurt greco bianco 0% o Skyr + 30 g di cereali integrali Misura + cannella + caffè/tè verde.','20 g di mandorle o noci.','Mensa: carne bianca o pesce (180–200 g) + doppia porzione di verdure + 1 cucchiaio di olio EVO; carboidrati azzerati.','100 g di yogurt greco 0% oppure 15 g di frutta secca.','200 g di pesce o carne magra + verdure; nessuna fonte di carboidrati complessi.']],
['Venerdì','Allenamento',['150 g di yogurt greco bianco 0% o Skyr + 30 g di cereali integrali Misura + cannella + 1 caffè amaro o tè verde.','1 frutto di stagione + 15 g di mandorle o noci.','Mensa: seconda portata a scelta tra pollo, tacchino, vitello magro, pesce bianco o merluzzo (150–200 g), verdure abbondanti e 60–70 g di riso/farro se disponibile; alternativa: 3 gallette di riso/farro portate da casa.','1 banana media oppure 2 gallette di riso con un velo leggero di crema 100% arachidi.','180–200 g di carne bianca, manzo magro o pesce + 180–200 g di patate oppure 70 g di riso basmati + verdure e 1 cucchiaio di olio EVO.']],
['Sabato','Riposo',['Yogurt greco bianco 0% o Skyr + 30 g di cereali integrali Misura + cannella + caffè/tè verde.','20 g di mandorle o noci.','Mensa: carne bianca o pesce (180–200 g) + doppia porzione di verdure + 1 cucchiaio di olio EVO; carboidrati azzerati.','100 g di yogurt greco 0% oppure 15 g di frutta secca.','200 g di pesce o carne magra + verdure; nessuna fonte di carboidrati complessi.']],
['Domenica','Riposo',['Yogurt greco bianco 0% o Skyr + 30 g di cereali integrali Misura + cannella + caffè/tè verde.','20 g di mandorle o noci.','Mensa: carne bianca o pesce (180–200 g) + doppia porzione di verdure + 1 cucchiaio di olio EVO; carboidrati azzerati.','100 g di yogurt greco 0% oppure 15 g di frutta secca.','200 g di pesce o carne magra + verdure; nessuna fonte di carboidrati complessi.']]
];
const mealNames=['Colazione','Spuntino mattina','Pranzo','Spuntino pomeridiano','Cena'];
let person='sere',scope='both';
function render(){const p=person==='sere'?S:M;document.getElementById('info').textContent=person==='sere'?'Il pranzo di Sere è a casa e quindi gli alimenti indicati contribuiscono alla lista della spesa.':'Il pranzo di Meridio è previsto in mensa: non viene inserito nella lista della spesa. Le gallette indicate come alternativa da portare da casa invece vengono considerate.';document.getElementById('days').innerHTML=p.map(d=>`<article class="day"><h2>${d[0]}<span>${d[1]}</span></h2>${d[2].map((x,i)=>`<div class="meal"><b>${mealNames[i]}</b>${x}</div>`).join('')}</article>`).join('');document.getElementById('bs').className=person==='sere'?'on':'';document.getElementById('bm').className=person==='meridio'?'on':''}
const shopSere=[
'Yogurt greco/Skyr','Avena','Burro d’arachidi','Cannella','Mela','Mandorle','Riso basmati','Farro','Pollo','Tofu','Verdure','Olio EVO','Cioccolato fondente 85%+','Noci','Patate','Insalata','Uova','Pane integrale','Caffè','Parmigiano','Sgombro','Tonno al naturale','Zucchine','Spinaci','Gallette di riso/farro','Marmellata senza zuccheri aggiunti','Miele','Tè verde','Manzo','Rucola','Pomodorini','Pane di segale','Cereali integrali','Frutta fresca','Skyr liquido','Mirtilli','Cous cous','Quinoa','Ceci','Lenticchie','Cetrioli','Tacchino','Riso nero/integrale','Broccoli','Fagiolini','Yogurt bianco magro','Guacamole leggero','Verdure verdi','Orzo','Carne macinata magra','Peperoni','Carote','Uvetta','Polpo','Seppie','Gamberi','Finocchio','Pizza classica della tradizione','Pasta','Sugo leggero','Biscotti secchi integrali','Pancake fit','Dolce fatto in casa','Pesce magro','Pane tostato','Tisana'
];
const shopMeridio=['Yogurt greco 0%/Skyr','Cereali integrali Misura','Cannella','Caffè','Tè verde','Frutta di stagione','Mandorle','Noci','Gallette di riso/farro','Crema 100% arachidi','Banane','Patate','Riso basmati','Verdure','Olio EVO','Carne bianca','Manzo magro','Pesce','Yogurt greco 0%'];
const group={"Frutta e verdura":['Mela','Frutta','Frutta fresca','Mirtilli','Patate','Zucchine','Spinaci','Pomodorini','Rucola','Cetrioli','Broccoli','Fagiolini','Verdure','Verdure verdi','Peperoni','Carote','Finocchio','Banane','Pesce magro'],"Carne e pesce":['Pollo','Tofu','Sgombro','Tonno al naturale','Manzo','Tacchino','Carne macinata magra','Polpo','Seppie','Gamberi','Pesce','Carne bianca','Manzo magro'],"Latticini e uova":['Yogurt greco/Skyr','Yogurt greco 0%/Skyr','Yogurt greco 0%','Yogurt bianco magro','Yogurt','Skyr liquido','Parmigiano','Uova'],"Pane, cereali e derivati":['Avena','Riso basmati','Farro','Pane integrale','Gallette di riso/farro','Cereali integrali','Cous cous','Quinoa','Riso nero/integrale','Orzo','Pasta','Pane di segale','Pane tostato','Cereali integrali Misura','Biscotti secchi integrali','Pancake fit','Dolce fatto in casa'],"Dispensa e altro":['Burro d’arachidi','Cannella','Olio EVO','Cioccolato fondente 85%+','Noci','Mandorle','Marmellata senza zuccheri aggiunti','Miele','Tè verde','Caffè','Crema 100% arachidi','Uvetta','Guacamole leggero','Sugo leggero','Tisana','Pizza classica della tradizione','Lenticchie','Ceci']};
function unique(a){return [...new Set(a)]}
function shop(){let names=[];if(scope!=='meridio')names=names.concat(shopSere);if(scope!=='sere')names=names.concat(shopMeridio);names=unique(names);let html='';for(const [g,arr] of Object.entries(group)){const rows=arr.filter(x=>names.includes(x));if(!rows.length)continue;html+=`<div class="cat"><h3>${g}</h3>${rows.map(n=>{const id='shop_'+btoa(unescape(encodeURIComponent(n))).replace(/[^a-zA-Z0-9]/g,'');const checked=localStorage.getItem(id)==='1'?' checked':'';return `<label class="item${checked?' done':''}"><input type="checkbox" data-id="${id}"${checked}><span>${n}</span></label>`}).join('')}</div>`}document.getElementById('list').innerHTML=html||'<div class="info">Nessun alimento da mostrare.</div>';document.querySelectorAll('#list input').forEach(cb=>cb.addEventListener('change',e=>{localStorage.setItem(e.target.dataset.id,e.target.checked?'1':'0');e.target.closest('.item').classList.toggle('done',e.target.checked)}));document.getElementById('bb').className=scope==='both'?'on':'';document.getElementById('bs2').className=scope==='sere'?'on':'';document.getElementById('bm2').className=scope==='meridio'?'on':''}
function page(x){document.getElementById('menu').classList.toggle('active',x==='menu');document.getElementById('shop').classList.toggle('active',x==='shop');document.getElementById('nm').className=x==='menu'?'on':'';document.getElementById('ng').className=x==='shop'?'on':'';if(x==='shop')shop()}
document.getElementById('bs').onclick=()=>{person='sere';render()};document.getElementById('bm').onclick=()=>{person='meridio';render()};document.getElementById('bb').onclick=()=>{scope='both';shop()};document.getElementById('bs2').onclick=()=>{scope='sere';shop()};document.getElementById('bm2').onclick=()=>{scope='meridio';shop()};document.getElementById('nm').onclick=()=>page('menu');document.getElementById('ng').onclick=()=>page('shop');document.getElementById('reset').onclick=()=>{document.querySelectorAll('#list input').forEach(cb=>localStorage.removeItem(cb.dataset.id));shop()};render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
</script></body></html>
